<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mi Miscelánea</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#0f766e;--acx:#fff;--bd:#e3e1da;--rd:#c2410c;--yl:#b45309;--gr:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#a3a29b;--ac:#2dd4bf;--acx:#06201d;--bd:#33332f;--rd:#fb923c;--yl:#fbbf24;--gr:#4ade80}}
:root[data-theme=dark]{--bg:#141413;--card:#1f1f1d;--tx:#f0efe9;--mut:#a3a29b;--ac:#2dd4bf;--acx:#06201d;--bd:#33332f;--rd:#fb923c;--yl:#fbbf24;--gr:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:80px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;border-bottom:1px solid var(--bd)}
#st{font-size:12px;color:var(--mut);text-align:right}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
main{max-width:760px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);cursor:pointer;position:relative}nav a.on{color:var(--ac);font-weight:700}nav i{display:block;font-style:normal;font-size:20px}
.badge{position:absolute;top:2px;left:55%;background:var(--rd);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-size:15px;font-weight:600;cursor:pointer}button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;margin:8px 0}.row>input{flex:1}.row>button{flex:0 0 auto}.row>button:only-child,.row>button:last-child:not(:first-child){flex:1}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
small{display:block;color:var(--mut);font-size:12px}.mut{color:var(--mut)}h4{margin:18px 0 4px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kpi b{font-size:19px}
.qty{display:flex;align-items:center;gap:10px}.qty button{padding:6px 12px}.tot{display:flex;justify-content:space-between;font-size:24px;margin:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.chips span{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;white-space:nowrap;font-size:13px;cursor:pointer}.chips .on{background:var(--ac);color:var(--acx)}
#m{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:5}#m[hidden]{display:none}
.box{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 0}.out{color:var(--rd)}.low{color:var(--yl)}.ok{color:var(--gr)}
#t{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:9;font-size:14px;max-width:90%;display:none}
</style></head><body>
<header><b>🛍️ Mi Miscelánea</b><div id="st"></div></header><main id="v"></main><nav id="nav"></nav><div id="m" hidden></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-CO'),num=s=>parseFloat(String(s).replace(',','.'))||0;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const day=ts=>new Date(ts).toLocaleDateString('en-CA'),DC=['Útiles escolares','Papelería','Fotocopias e impresiones','Otros'];let CATS=DC;function applyCats(){CATS=(S.cfg&&S.cfg.cats&&S.cfg.cats.list)||DC}
const TY={venta:'Venta',compra:'Compra',pedido:'Encomienda recibida',ajuste:'Ajuste',inicial:'Stock inicial'};
let S={products:{},moves:{},sales:{},orders:{},cfg:{}},D={},cart=[],tab='venta',q='',cat='',per='hoy',db=null,stream=null,pushing=0;
function load(){try{const r=localStorage.getItem('misc_v1');if(r)S=Object.assign(S,JSON.parse(r));D=JSON.parse(localStorage.getItem('misc_d')||'{}');cart=JSON.parse(localStorage.getItem('misc_cart')||'[]')}catch(e){}}
function save(){try{localStorage.setItem('misc_v1',JSON.stringify(S));localStorage.setItem('misc_d',JSON.stringify(D))}catch(e){toast('⚠ Almacenamiento lleno: descarga una copia')}}
function sc(){try{localStorage.setItem('misc_cart',JSON.stringify(cart))}catch(e){}}
function toast(s){const t=$('#t');t.textContent=s;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)}
function put(c,o){o.u=Date.now();S[c][o.id]=o;D[c+'/'+o.id]=1;save();push()}
function ST(){const s={};for(const m of Object.values(S.moves))s[m.pid]=(s[m.pid]||0)+m.q;return s}
async function getDb(){if(db)return db;try{if(!window.claude)return null;db=await claude.use('db');if(db)startPull()}catch(e){db=null}status();return db}
function startPull(){for(const c of ['products','moves','sales','orders','cfg'])db.collection(c).onSnapshot(s=>{let ch=0;s.docs.forEach(d=>{const r=d.data();if(!r)return;r.id=d.id;const l=S[c][d.id];if(!l||((r.u||0)>(l.u||0)&&!D[c+'/'+d.id])){S[c][d.id]=r;ch=1}});if(ch){applyCats();save();render()}status()},()=>{})}
async function push(){if(pushing||!navigator.onLine)return;const d=await getDb();if(!d)return;pushing=1;try{for(const k of Object.keys(D)){const [c,id]=k.split('/'),o=S[c]&&S[c][id];if(!o){delete D[k];continue}const u=o.u;await d.collection(c).doc(id).set(o);if(S[c][id].u===u)delete D[k]}}catch(e){}pushing=0;save();status()}
function status(){const n=Object.keys(D).length,e=$('#st');if(!e)return;e.innerHTML=!navigator.onLine?`<i class=dot style="background:var(--rd)"></i>Sin conexión · ${n} por enviar<br>Todo se guarda aquí`:db?`<i class=dot style="background:var(--gr)"></i>En línea · ${n?n+' por enviar':'sincronizado'}`:`<i class=dot style="background:var(--yl)"></i>Nube no disponible · guardado local`}
function closeM(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#m').hidden=true}
function ask(title,fields,ok,extra){const m=$('#m');m.innerHTML=`<div class=box><h3 style=margin-top:0>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.l)}${f.t==='select'?`<select id=f_${f.k}>${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id=f_${f.k} type=${f.t||'text'} ${f.t==='number'?'step=any inputmode=decimal':''} ${f.dl?'list=dl_'+f.k:''} value="${esc(f.v??'')}">`}</label>${f.dl?`<datalist id=dl_${f.k}>${f.dl.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`).join('')}<div class=row><button class=g onclick=closeM()>Cancelar</button><button onclick=okM()>Guardar</button></div>${extra||''}</div>`;m.hidden=false;window.okM=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value);if(ok(v)!==false)closeM()}}
async function scan(cb){
const m=$('#m');
const manual=()=>{m.innerHTML=`<div class=box><h3 style=margin-top:0>Ingresar código</h3><p class=mut>Si este navegador no permite escanear con la cámara, escribe el número del código de barras o conecta un lector Bluetooth.</p><label>Código de barras<input id=manualCode autocomplete=off inputmode=numeric placeholder="Ej. 7701234567890"></label><div class=row><button class=g onclick=closeM()>Cancelar</button><button onclick="submitManualCode()">Continuar</button></div></div>`;m.hidden=false;window.submitManualCode=()=>{const code=$('#manualCode').value.trim();if(!code){toast('Escribe o escanea un código');return}closeM();cb(code)};setTimeout(()=>$('#manualCode')?.focus(),100)};
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!('BarcodeDetector' in window)){manual();return}
m.innerHTML='<div class=box><h3 style=margin-top:0>Escanear código de barras</h3><p class=mut>Apunta la cámara trasera al código. Si no lo reconoce, puedes ingresarlo manualmente.</p><video id=vd playsinline muted style="width:100%;border-radius:10px;background:#000;max-height:55vh;object-fit:contain"></video><div class=row><button class=g onclick=closeM()>Cerrar</button><button onclick="fallbackScan()">Escribir código</button></div></div>';m.hidden=false;
window.fallbackScan=()=>{closeM();manual()};
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
const v=$('#vd');if(!v||!stream)return;v.srcObject=stream;await v.play();
let det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code']})}catch(e){det=new BarcodeDetector()}
const loop=async()=>{if(!stream)return;try{const r=await det.detect(v);if(r&&r.length){const code=r[0].rawValue;closeM();cb(code);return}}catch(e){}if(stream)setTimeout(loop,250)};
loop()
}catch(e){closeM();toast('No se pudo abrir la cámara. Revisa el permiso de cámara o escribe el código.');manual()}
}
const match=(p,s)=>(p.n+' '+p.cd).toLowerCase().includes(s.toLowerCase()),act=()=>Object.values(S.products).filter(p=>!p.off);
function onScan(code){const p=act().find(x=>x.cd===code);if(p)add(p.id);else{toast('Código no registrado: créalo');editP(null,code)}}
function enter(v){const p=act().find(x=>x.cd===v.trim());if(p)return add(p.id);const l=act().filter(x=>match(x,v));if(l.length===1)add(l[0].id)}
function add(id){const p=S.products[id],c=cart.find(x=>x.id===id);if(c)c.q++;else cart.push({id,n:p.n,pv:p.pv,pc:p.pc,tiers:p.tiers,q:1});if(p.track&&(ST()[id]||0)<(c?c.q:1))toast('Ojo: el stock registrado es menor');q='';sc();render()}
const up=c=>{let v=c.pv;(c.tiers||[]).forEach(([m,pr])=>{if(c.q>=m)v=pr});return v},parseT=s=>String(s||'').split(',').map(x=>x.split(':').map(num)).filter(t=>t.length===2&&t[0]>0&&t[1]>0).sort((a,b)=>a[0]-b[0]);
function sq(i,v){v=Math.floor(num(v));if(v<=0)cart.splice(i,1);else cart[i].q=v;sc();render()}
function editC(){ask('Categorías',[{k:'l',l:'Sepáralas con coma. Si solo cambias nombres (misma cantidad), se actualizan los productos',v:CATS.join(', ')}],v=>{const n=v.l.split(',').map(x=>x.replace(/["'<>&]/g,'').trim()).filter(Boolean);if(!n.length)return false;if(n.length===CATS.length)act().forEach(p=>{const i=CATS.indexOf(p.c);if(i>=0&&n[i]!==p.c){p.c=n[i];put('products',p)}});put('cfg',{id:'cats',list:n});applyCats();cat='';render()})}
function cq(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);sc();render()}
function cobrar(){const id=uid(),ts=Date.now(),items=cart.map(c=>({pid:c.id,n:c.n,q:c.q,pc:c.pc,pv:up(c)}));put('sales',{id,ts,items,total:items.reduce((a,i)=>a+i.pv*i.q,0),profit:items.reduce((a,i)=>a+(i.pv-i.pc)*i.q,0)});items.forEach((i,k)=>{if(S.products[i.pid].track)put('moves',{id:id+'-'+k,pid:i.pid,q:-i.q,t:'venta',ts,ref:id,note:i.n})});toast('Venta guardada');cart=[];sc();render()}
function setQ(v){q=v;const e=$('#res');if(e)e.innerHTML=tab==='venta'?resV():listS()}
function resV(){const st=ST();return q?act().filter(p=>match(p,q)).slice(0,12).map(p=>`<div class=it onclick="add('${p.id}')"><div><b>${esc(p.n)}</b><small>${esc(p.c)} · ${p.track?'Stock '+(st[p.id]||0):'Servicio'}</small></div><span>${money(p.pv)}</span></div>`).join('')||'<p class=mut>Sin resultados</p>':''}
function vVenta(){const t=day(Date.now());let tot=0,gan=0,n=0;Object.values(S.sales).forEach(s=>{if(day(s.ts)===t){tot+=s.total;gan+=s.profit;n++}});const total=cart.reduce((a,c)=>a+up(c)*c.q,0);
return `<div class=kpi><div><b>${money(tot)}</b><small>Ventas de hoy (${n})</small></div><div><b class=ok>${money(gan)}</b><small>Ganancia de hoy</small></div></div>
<div class=row><input id=q placeholder="Buscar o escanear código…" value="${esc(q)}" oninput="setQ(this.value)" onkeydown="if(event.key==='Enter')enter(this.value)"><button onclick="scan(onScan)">📷</button></div><div id=res>${resV()}</div>
<h4>Venta actual</h4>${cart.length?cart.map((c,i)=>`<div class=it style=cursor:default><div><b>${esc(c.n)}</b><small>${money(up(c))} c/u</small></div><div class=qty><button onclick="cq(${i},-1)">−</button><input type=number inputmode=numeric min=1 value="${c.q}" style="width:72px;text-align:center" onchange="sq(${i},this.value)"><button onclick="cq(${i},1)">+</button></div></div>`).join('')+`<div class=tot><span>Total</span><b>${money(total)}</b></div><div class=row><button class=g onclick="cart=[];sc();render()">Vaciar</button><button onclick="cobrar()">Cobrar</button></div>`:`<p class=mut>${act().length?'Busca o escanea un producto para empezar.':'Primero agrega productos en la pestaña Stock.'}</p>`}`}
function listS(){const st=ST(),l=act().filter(p=>(!cat||p.c===cat)&&(!q||match(p,q))).sort((a,b)=>a.n.localeCompare(b.n));return l.map(p=>{const s=st[p.id]||0,k=!p.track?'':s<=0?'out':s<=p.min?'low':'';return `<div class=it onclick="editP('${p.id}')"><div><b>${esc(p.n)}</b><small>${esc(p.c)} · compra ${money(p.pc)} · venta ${money(p.pv)}</small></div><b class="${k}">${p.track?s:'—'}</b></div>`}).join('')||'<p class=mut>Aún no hay productos. Toca ＋ para crear el primero.</p>'}
function vStock(){return `<div class=row><input id=q placeholder="Buscar producto…" value="${esc(q)}" oninput="setQ(this.value)"><button onclick="scan(c=>{const p=act().find(x=>x.cd===c);if(p){editP(p.id)}else{editP(null,c)}})">📷 Escanear</button><button onclick="editP()">＋</button></div><div class=chips>${['',...CATS].map(c=>`<span class="${cat===c?'on':''}" onclick="cat='${c}';render()">${c||'Todas'}</span>`).join('')}<span onclick="editC()">⚙ Categorías</span></div><div id=res>${listS()}</div>`}
function editP(id,code){const p=id?S.products[id]:{id:uid(),n:'',cd:code||'',c:CATS[0],pc:0,pv:0,min:3,track:true};
const f=[{k:'n',l:'Nombre',v:p.n},{k:'cd',l:'Código de barras (opcional)',v:p.cd},{k:'c',l:'Categoría',t:'select',o:CATS,v:p.c},{k:'pc',l:'Precio de compra',t:'number',v:p.pc},{k:'pv',l:'Precio de venta',t:'number',v:p.pv},{k:'min',l:'Avisar cuando queden…',t:'number',v:p.min},{k:'track',l:'Controlar stock (No = servicio, ej. fotocopias)',t:'select',o:['Sí','No'],v:p.track?'Sí':'No'},{k:'ti',l:'Precio por cantidad (opcional), formato desde:precio. Ej: 1:200, 20:150, 100:100',v:(p.tiers||[]).map(t=>t.join(':')).join(', ')}];if(!id)f.push({k:'s0',l:'Stock inicial',t:'number',v:0});
ask(id?'Editar producto':'Nuevo producto',f,v=>{if(!v.n.trim()){toast('Falta el nombre');return false}if(v.cd.trim()&&act().some(x=>x.id!==p.id&&x.cd===v.cd.trim())){toast('Ese código ya existe');return false}Object.assign(p,{n:v.n.trim(),cd:v.cd.trim(),c:v.c,pc:num(v.pc),pv:num(v.pv),min:num(v.min),track:v.track==='Sí',tiers:parseT(v.ti)});put('products',p);if(!id&&num(v.s0)>0&&p.track)put('moves',{id:uid(),pid:p.id,q:num(v.s0),t:'inicial',ts:Date.now(),note:'Stock inicial'});render()},id?`<div class=row><button class=g onclick="adj('${id}')">Ajustar conteo</button><button class=g onclick="buy('${id}')">+ Compra</button><button class=g onclick="arch('${id}')">Quitar</button></div>`:'')}
function adj(id){const p=S.products[id],s=ST()[id]||0;ask('Conteo real: '+p.n,[{k:'r',l:'Unidades que hay realmente',t:'number',v:s}],v=>{const d=num(v.r)-s;if(d)put('moves',{id:uid(),pid:id,q:d,t:'ajuste',ts:Date.now(),note:'Conteo físico'});render()})}
function buy(id){const p=S.products[id];ask('Compra: '+p.n,[{k:'q',l:'Unidades compradas',t:'number',v:1},{k:'c',l:'Precio de compra unitario',t:'number',v:p.pc}],v=>{const q=num(v.q),c=num(v.c);if(q<=0)return false;if(c&&c!==p.pc){p.pc=c;put('products',p)}put('moves',{id:uid(),pid:id,q,t:'compra',ts:Date.now(),cost:c||p.pc,note:p.n});render()})}
function arch(id){if(confirm('¿Quitar este producto de la lista? El historial se conserva.')){S.products[id].off=true;put('products',S.products[id]);closeM();render()}}
function newO(pid){const p=pid&&S.products[pid];ask('Nueva encomienda',[{k:'n',l:'Producto',v:p?p.n:'',dl:act().map(x=>x.n)},{k:'q',l:'Cantidad a pedir',t:'number',v:p?Math.max(1,p.min*2):1},{k:'prov',l:'Proveedor / a quién se pidió'},{k:'fd',l:'Fecha del pedido',t:'date',v:day(Date.now())},{k:'eta',l:'Fecha en que debe llegar',t:'date'}],v=>{if(!v.n.trim()){toast('Falta el producto');return false}const m=act().find(x=>x.n.toLowerCase()===v.n.trim().toLowerCase());put('orders',{id:uid(),n:v.n.trim(),pid:m?m.id:null,q:num(v.q),prov:v.prov,ts:new Date((v.fd||day(Date.now()))+'T12:00').getTime(),eta:v.eta,st:'pendiente'});tab='ped';render()})}
function recv(id){const o=S.orders[id],p=S.products[o.pid];ask('Recibir: '+o.n,[{k:'q',l:'Unidades que llegaron',t:'number',v:o.q},{k:'c',l:'Precio de compra unitario (opcional)',t:'number',v:p?p.pc:0}],v=>{const rq=num(v.q),c=num(v.c);let pr=p;if(!pr){pr={id:uid(),n:o.n,cd:'',c:CATS[CATS.length-1],pc:c,pv:0,min:3,track:true};put('products',pr);o.pid=pr.id;toast('Producto nuevo creado: falta su precio de venta')}else if(c>0&&c!==pr.pc){pr.pc=c;put('products',pr)}if(pr.track&&rq>0)put('moves',{id:'rcv-'+o.id,pid:pr.id,q:rq,t:'pedido',ts:Date.now(),ref:o.id,cost:c||pr.pc,note:o.n});o.st='recibido';o.rq=rq;o.rts=Date.now();put('orders',o);render()})}
function canc(id){if(confirm('¿Cancelar esta encomienda?')){S.orders[id].st='cancelado';put('orders',S.orders[id]);render()}}
function vPed(){const l=Object.values(S.orders).filter(o=>o.st!=='cancelado').sort((a,b)=>a.st===b.st?b.ts-a.ts:a.st==='pendiente'?-1:1);
return `<div class=row><button onclick="newO()">＋ Nueva encomienda</button></div>`+(l.map(o=>`<div class=it style=cursor:default><div><b>${esc(o.n)}</b> × ${o.q}<small>Pedido ${day(o.ts)}${o.eta?' · llega '+o.eta:''}${o.prov?' · '+esc(o.prov):''}</small><small class="${o.st==='pendiente'?'low':'ok'}">${o.st==='pendiente'?'Pendiente':'Recibida: '+o.rq+' uds el '+day(o.rts)}</small></div>${o.st==='pendiente'?`<div class=qty><button onclick="recv('${o.id}')">Recibida</button><button class=g onclick="canc('${o.id}')">✕</button></div>`:''}</div>`).join('')||'<p class=mut>No hay encomiendas registradas.</p>')}
function alerts(){const st=ST(),a=[],now=Date.now(),t=day(now);for(const p of act()){if(!p.track)continue;const s=st[p.id]||0;if(s<=0)a.push({k:'out',t:'Agotado: '+p.n,s:'Debes comprarlo',p:p.id});else if(s<=p.min)a.push({k:'low',t:'Por agotarse: '+p.n,s:`Quedan ${s} (aviso en ${p.min})`,p:p.id})}
for(const o of Object.values(S.orders)){if(o.st!=='pendiente')continue;const age=Math.floor((now-o.ts)/864e5);if(o.eta&&o.eta<t)a.push({k:'out',t:'Encomienda atrasada: '+o.n,s:`Debía llegar el ${o.eta}. Reclámala${o.prov?' a '+o.prov:''}`});else if(o.eta&&o.eta<=day(now+864e5))a.push({k:'low',t:'Llega pronto: '+o.n,s:'Fecha esperada '+o.eta});else if(!o.eta&&age>=7)a.push({k:'low',t:`Sin llegar hace ${age} días: ${o.n}`,s:'Considera reclamarla'})}
let lb=0;try{lb=+localStorage.getItem('misc_bk')||0}catch(e){}if(Object.keys(S.sales).length&&now-lb>7*864e5)a.push({k:'low',t:'Haz una copia de seguridad',s:'Reportes → Descargar copia'});return a}
function vAl(a){return a.length?a.map(x=>`<div class=it ${x.p?`onclick="newO('${x.p}')"`:'style=cursor:default'}><div><b class="${x.k}">${esc(x.t)}</b><small>${esc(x.s)}</small></div>${x.p?'<span>Pedir ›</span>':''}</div>`).join(''):'<p class=mut>Todo en orden. No hay alertas.</p>'}
function vRep(){const n=Date.now(),T=day(n),f={hoy:s=>day(s)===T,'7':s=>n-s<7*864e5,mes:s=>day(s).slice(0,7)===T.slice(0,7),todo:()=>true}[per],st=ST(),sl=Object.values(S.sales).filter(s=>f(s.ts));let ing=0,gan=0,comp=0,vc=0,vv=0;const top={},bc={};
sl.forEach(s=>{ing+=s.total;gan+=s.profit;s.items.forEach(i=>{top[i.n]=(top[i.n]||0)+i.q;const c=(S.products[i.pid]||{}).c||'Otros';bc[c]=(bc[c]||0)+i.pv*i.q})});
Object.values(S.moves).forEach(m=>{if(m.cost&&m.q>0&&f(m.ts))comp+=m.q*m.cost});act().forEach(p=>{if(p.track){const s=Math.max(0,st[p.id]||0);vc+=s*p.pc;vv+=s*p.pv}});
const L=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5),h=Object.values(S.moves).sort((a,b)=>b.ts-a.ts).slice(0,60);
return `<select onchange="per=this.value;render()">${[['hoy','Hoy'],['7','Últimos 7 días'],['mes','Este mes'],['todo','Todo']].map(([k,l])=>`<option value=${k} ${per===k?'selected':''}>${l}</option>`).join('')}</select>
<div class=kpi style=margin-top:8px><div><b>${money(ing)}</b><small>Ventas (${sl.length})</small></div><div><b class=ok>${money(gan)}</b><small>Ganancia</small></div><div><b>${money(comp)}</b><small>Compras</small></div><div><b>${money(vc)}</b><small>Inventario a costo (a venta ${money(vv)})</small></div></div>
<h4>Ventas por categoría</h4>${L(bc).map(([k,v])=>`<div class=it style=cursor:default><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')||'<p class=mut>Sin ventas</p>'}
<h4>Más vendidos</h4>${L(top).map(([k,v])=>`<div class=it style=cursor:default><span>${esc(k)}</span><b>${v} uds</b></div>`).join('')||'<p class=mut>Sin ventas</p>'}
<h4>Copia de seguridad</h4><div class=row><button onclick="backup()">⬇ Descargar copia</button><button class=g onclick="$('#rf').click()">Restaurar</button><button class=g onclick="push();toast('Sincronizando…')">Sincronizar</button></div><input id=rf type=file accept=".json" hidden onchange="restore(this)">
<h4>Historial de movimientos</h4>${h.map(m=>`<div class=it style=cursor:default><div><b>${esc((S.products[m.pid]||{}).n||m.note||'?')}</b><small>${TY[m.t]||m.t} · ${new Date(m.ts).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})}</small></div><b class="${m.q<0?'out':'ok'}">${m.q>0?'+':''}${m.q}</b></div>`).join('')||'<p class=mut>Sin movimientos</p>'}`}
async function backup(){let dl=null;try{dl=await claude.use('downloads')}catch(e){}const fn='copia-miscelanea-'+day(Date.now())+'.json',dt=JSON.stringify({v:1,S});try{if(dl)await dl.save({filename:fn,data:dt});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dt],{type:'application/json'}));a.download=fn;a.click()}localStorage.setItem('misc_bk',Date.now());render()}catch(e){toast('No se guardó la copia')}}
function restore(el){const f=el.files[0];if(!f)return;f.text().then(t=>{const r=JSON.parse(t).S;let n=0;for(const c of ['products','moves','sales','orders','cfg'])for(const o of Object.values(r[c]||{}))if(!S[c][o.id]||(o.u||0)>(S[c][o.id].u||0)){S[c][o.id]=o;D[c+'/'+o.id]=1;n++}save();push();render();toast(n+' registros restaurados')}).catch(()=>toast('Archivo no válido'))}
function go(t){tab=t;q='';render()}
function render(){const a=alerts();$('#nav').innerHTML=[['venta','🛒','Vender'],['stock','📦','Stock'],['ped','🚚','Pedidos'],['al','🔔','Alertas'],['rep','📊','Reportes']].map(([k,i,l])=>`<a class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}${k==='al'&&a.length?`<span class=badge>${a.length}</span>`:''}</a>`).join('');$('#v').innerHTML={venta:vVenta,stock:vStock,ped:vPed,al:()=>vAl(a),rep:vRep}[tab]();status();if(tab==='venta'&&matchMedia('(pointer:fine)').matches){const e=$('#q');e&&e.focus()}}
load();applyCats();render();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
getDb().then(push);setInterval(()=>{getDb().then(push);render()},30000);
addEventListener('online',()=>{getDb().then(push);status()});addEventListener('offline',status);
</script></body></html>
